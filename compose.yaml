services:
  app:
    build: .
    ports:
      - "${PORT:-8000}:8000"
    environment:
      PORT: 8000
      DB_PATH: /data/tasks.db
    volumes:
      - tasks:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  tasks:
